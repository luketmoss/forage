name: Deploy to GitHub Pages

# Forage moved into Keel (luketmoss/keel#700). This site now publishes only the
# redirect page in redirect/, as both index.html and 404.html, so every old URL
# lands on https://luketmoss.github.io/keel/forage/ with its path, query and
# hash. Nothing is installed, tested or built, and no secret is read.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'redirect/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
